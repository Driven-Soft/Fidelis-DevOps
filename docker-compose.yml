version: '3.9'

services:

  fidelis-oracle:
    image: gvenzl/oracle-xe
    container_name: fidelis-oracle

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: fidelis

    volumes:
      - oracle_data:/opt/oracle/oradata

    restart: always

  fidelis-api:
    build: .

    container_name: fidelis-api

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@fidelis-oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: system
      SPRING_DATASOURCE_PASSWORD: fidelis

    depends_on:
      - fidelis-oracle

    restart: always

volumes:
  oracle_data: