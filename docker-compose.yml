services:

  fidelis-mysql:
    build:
      context: .
      dockerfile: docker/database/Dockerfile
    
    container_name: fidelis-mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: fidelis
      MYSQL_USER: fidelis
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    restart: never

  fidelis-api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile

    container_name: fidelis-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FidelisMySql: Server=fidelis-mysql;Port=3306;Database=fidelis;User ID=fidelis;Password=${MYSQL_PASSWORD};

    depends_on:
      - fidelis-mysql

    command:
      sh -c "sleep 15 && dotnet Fidelis.Api.dll"

    restart: never

volumes:
  mysql_data: