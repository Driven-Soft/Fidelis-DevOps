version: '3.9'

services:

  fidelis-mysql:
    build: .
    
    container_name: fidelis-mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: fidelis
      MYSQL_USER: fidelis
      MYSQL_PASSWORD: fidelis
      MYSQL_ROOT_PASSWORD: fidelis

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always

  fidelis-api:
    build: .

    container_name: fidelis-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FidelisMySql: Server=fidelis-mysql;Port=3306;Database=fidelis;User ID=fidelis;Password=fidelis;

    depends_on:
      - fidelis-mysql

    command:
      sh -c "sleep 15 && dotnet Fidelis.Api.dll"

    restart: always

volumes:
  mysql_data: